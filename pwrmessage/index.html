<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pwRMessage</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="./tailwind.css">
    <script src="./socket.io.min.js"></script>
</head>

<body>
    <div id="toast-container"></div>

    <div id="auth-view" class="flex items-center justify-center h-screen bg-gray-50">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm">
            <h1 class="text-2xl font-bold mb-6 tracking-tighter text-center">pwRMessage</h1>
            <input id="auth-user" type="text" placeholder="Username"
                class="w-full bg-gray-100 p-4 rounded-xl mb-3 outline-none focus:ring-2 focus:ring-black">
            <input id="auth-pass" type="password" placeholder="Password"
                class="w-full bg-gray-100 p-4 rounded-xl mb-6 outline-none focus:ring-2 focus:ring-black">
            <div class="flex gap-2">
                <button onclick="handleAuth('login')"
                    class="flex-grow bg-black text-white p-4 rounded-xl font-bold hover:opacity-90">Login</button>
                <button onclick="handleAuth('register')"
                    class="flex-grow border-2 border-black p-4 rounded-xl font-bold hover:bg-gray-50">Sign Up</button>
            </div>
        </div>
    </div>

    <div id="app-view" class="hidden h-screen flex">
        <div id="customModal" class="modal-overlay">
            <div class="modal-card">
                <h2 id="modalTitle" class="text-xl font-bold mb-2"></h2>
                <p id="modalDesc" class="text-gray-500 mb-6 text-sm"></p>
                <input id="modalInput" type="text"
                    class="w-full bg-gray-100 p-4 rounded-xl outline-none focus:ring-2 focus:ring-black mb-6">
                <div class="flex gap-3">
                    <button onclick="closeModal()"
                        class="flex-grow p-3 rounded-xl font-bold text-gray-400 hover:bg-gray-50 transition">Cancel</button>
                    <button id="modalConfirm"
                        class="flex-grow p-3 rounded-xl font-bold bg-black text-white hover:opacity-90 transition">Confirm</button>
                </div>
            </div>
        </div>

        <aside class="sidebar flex flex-col">
            <div class="p-6 border-b flex justify-between items-center">
                <h1 class="text-xl font-bold tracking-tighter">pwRMessage</h1>
                <button id="logoutBtn"
                    class="text-xs font-bold text-gray-400 hover:text-black uppercase">Logout</button>
            </div>
            <div class="p-4 flex gap-2">
                <button onclick="uiCreateChat()"
                    class="flex-grow bg-black text-white font-semibold py-3 rounded-xl hover:opacity-80 transition">New
                    Chat</button>
                <button onclick="requestNotifs()" class="bg-gray-100 p-3 rounded-xl hover:bg-gray-200 transition">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>
            </div>
            <div id="userList" class="flex-grow overflow-y-auto px-2"></div>
        </aside>

        <main class="flex-grow flex flex-col bg-white">
            <header class="p-5 border-b flex items-center gap-3">
                <div class="flex flex-col items-start">
                    <span id="headerName" class="text-lg font-bold leading-tight">Select a contact</span>
                    <span id="headerStatus" class="text-xs font-medium h-4"></span>
                </div>
                <span id="typing-indicator" class="text-xs font-normal text-gray-400 italic ml-auto"></span>
            </header>
            <div id="messageDisplay" class="flex-grow p-6 overflow-y-auto flex flex-col"></div>
            <div class="p-4 bg-white border-t flex items-center gap-3">
                <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp" class="hidden"
                    onchange="handleImageUpload(this)">

                <button onclick="document.getElementById('imageInput').click()"
                    class="bg-gray-100 p-4 rounded-2xl hover:bg-gray-200 transition">
                    <img width="24" height="24" src="image-upload.svg">
                </button>

                <input id="msgInput" type="text" placeholder="Write a message..."
                    class="flex-grow bg-gray-100 p-4 rounded-2xl outline-none focus:ring-1 focus:ring-black">
                <button id="sendBtn"
                    class="bg-black text-white px-8 h-full rounded-2xl font-bold hover:opacity-80 transition">Send</button>
            </div>
        </main>
    </div>

    <script src="./script.js"></script>
</body>

</html>
